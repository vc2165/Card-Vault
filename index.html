<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cards">
<meta name="referrer" content="no-referrer">
<!-- No network access at all: connect-src 'none' means this page cannot send your data anywhere. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'none'">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Card Vault</title>
<style>
:root{--bg:#0e1116;--panel:#161a22;--panel2:#1d222c;--line:#2a303c;--text:#e8ebf1;--muted:#8b93a3;--accent:#7c5cff;--accent2:#22c3a6;--danger:#ff5d6c;--warn:#ffb648}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.blur #app,body.blur #overlay{filter:blur(22px)}
#app{max-width:560px;margin:0 auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(100px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--muted)}
.btn{border:0;border-radius:12px;padding:13px 16px;background:var(--panel2);cursor:pointer;font-weight:600;width:100%}
.btn.primary{background:linear-gradient(135deg,var(--accent),#5b8cff);color:#fff}
.btn.danger{background:rgba(255,93,108,.12);color:var(--danger)}
.btn:disabled{opacity:.6}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:10px;font-weight:600}
.icon-btn{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.err{color:var(--danger);min-height:20px;margin:8px 0 0;font-size:14px}
.warn{color:var(--warn);font-size:13px;margin-top:6px}

/* Lock */
.lock{min-height:85dvh;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:6px}
.lock .logo{width:76px;height:76px;margin:0 auto 10px}
.lock h1{margin:0;font-size:26px}
.lock form{display:flex;flex-direction:column;gap:10px;margin-top:18px}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
header h1{margin:0;font-size:24px}
header .sub{font-size:13px;color:var(--muted)}
header .actions{display:flex;gap:8px}

.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:18px;font-weight:700;margin-top:2px}
.dues{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.dues h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.due{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.due:first-of-type{border-top:0}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.pill.hot{background:rgba(255,182,72,.15);color:var(--warn)}
.pill.bad{background:rgba(255,93,108,.15);color:var(--danger)}

.tools{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tools input{flex:1 1 100%}
.chips{display:flex;gap:8px}
.chip-f{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 14px;cursor:pointer;font-size:14px}
.chip-f.on{background:var(--text);color:var(--bg);border-color:var(--text)}

.list{display:flex;flex-direction:column;gap:14px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}

/* Card visual */
.tile{all:unset;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;width:100%;aspect-ratio:1.586;border-radius:18px;padding:18px 20px;color:#fff;position:relative;overflow:hidden;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.4)}
.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.2),transparent 55%);pointer-events:none}
.tile .row{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
.tile .bank{font-weight:700;font-size:17px;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .type{font-size:11px;text-transform:uppercase;letter-spacing:.12em;opacity:.85;border:1px solid rgba(255,255,255,.4);padding:2px 8px;border-radius:99px}
.tile .emv{width:42px;height:32px;border-radius:7px;background:linear-gradient(135deg,#f5d77a,#c9a443);position:relative;z-index:1}
.tile .num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:clamp(16px,5.4vw,22px);letter-spacing:.08em;position:relative;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.tile .nick{font-size:13px;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .net{font-weight:800;font-style:italic;font-size:16px;letter-spacing:.02em}
.tile .badge{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:2}
.c-midnight{background:linear-gradient(135deg,#24345e,#0b1020)}
.c-ocean{background:linear-gradient(135deg,#0f4c81,#1aa0c8)}
.c-emerald{background:linear-gradient(135deg,#0b6b4f,#1fbf8a)}
.c-crimson{background:linear-gradient(135deg,#7a0f1f,#d6304a)}
.c-gold{background:linear-gradient(135deg,#6e500e,#d9a93a)}
.c-violet{background:linear-gradient(135deg,#3b1e7a,#8a5cff)}
.c-rose{background:linear-gradient(135deg,#7a1e4f,#e0609a)}
.c-metal{background:linear-gradient(135deg,#111,#4a4a4a)}
.c-slate{background:linear-gradient(135deg,#2f3a4a,#61708a)}
.c-sunset{background:linear-gradient(135deg,#a63b14,#f39c3d)}

.fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--accent),#5b8cff);color:#fff;box-shadow:0 10px 30px rgba(124,92,255,.45);cursor:pointer;display:grid;place-items:center}
.fab svg{width:28px;height:28px}

/* Sheet */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20}
#overlay.open{display:block}
#sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:94dvh;overflow-y:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-h h2{margin:0;font-size:20px}
.fields{background:var(--panel2);border-radius:14px;margin-top:14px;overflow:hidden}
.field{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field .l{font-size:12px;color:var(--muted)}
.field .v{word-break:break-word}
.field .v.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.04em}
.field .grow{flex:1;min-width:0}
.copy{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;cursor:pointer;color:var(--text)}
.section-t{margin:18px 0 0;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 label{margin-top:12px}
.colors{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.colors input{display:none}
.colors label{margin:0;width:38px;height:38px;border-radius:12px;cursor:pointer;border:2px solid transparent}
.colors input:checked+label{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.btns{display:flex;gap:10px;margin-top:20px}
.set-item{display:flex;justify-content:space-between;align-items:center;padding:14px;border-top:1px solid var(--line);gap:12px}
.set-item:first-child{border-top:0}
.set-item select{width:auto}
.set-item .btn{width:auto;padding:9px 14px}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.2s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"><div id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="filePick" accept="application/json,.json" hidden>

<script>
'use strict';
/* ============ Utilities ============ */
const $ = s => document.querySelector(s);
const app = $('#app'), overlay = $('#overlay'), sheetEl = $('#sheet');
const enc = new TextEncoder(), dec = new TextDecoder();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const uid = () => b64(crypto.getRandomValues(new Uint8Array(9))).replace(/[+/=]/g,'x');
const inr = n => '₹' + Number(n||0).toLocaleString('en-IN');
const STORE = 'cardvault.v1', SETTINGS = 'cardvault.settings';
const ITER = 310000;
const ICON = {
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68 1.65 1.65 0 0 0 10 3.17V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>',
  logo:'<svg viewBox="0 0 512 512"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22c3a6"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="#161a22"/><rect x="96" y="150" width="320" height="212" rx="28" fill="url(#lg)"/><rect x="96" y="196" width="320" height="40" fill="#0e1116" opacity=".55"/><rect x="128" y="276" width="70" height="50" rx="10" fill="#f5d77a"/><rect x="232" y="296" width="150" height="14" rx="7" fill="#fff" opacity=".8"/></svg>'
};
const COLORS = ['midnight','ocean','emerald','violet','crimson','rose','gold','sunset','slate','metal'];
const NETWORKS = {visa:'VISA',mastercard:'Mastercard',rupay:'RuPay',amex:'AMEX',diners:'Diners',discover:'Discover',maestro:'Maestro',jcb:'JCB',other:''};

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}

/* ============ Card helpers ============ */
function detectNetwork(n){
  n=(n||'').replace(/\D/g,'');
  if(!n) return '';
  if(/^3[47]/.test(n)) return 'amex';
  if(/^(508|60|65|81|82|353|356)/.test(n)) return 'rupay';
  if(/^4/.test(n)) return 'visa';
  if(/^(5[1-5]|222[1-9]|22[3-9]|2[3-6]|27[01]|2720)/.test(n)) return 'mastercard';
  if(/^3(0[0-5]|[689])/.test(n)) return 'diners';
  if(/^35/.test(n)) return 'jcb';
  if(/^(50|5[6-9]|6)/.test(n)) return 'maestro';
  return 'other';
}
function luhn(n){n=(n||'').replace(/\D/g,'');if(n.length<12)return false;let s=0,d=false;for(let i=n.length-1;i>=0;i--){let x=+n[i];if(d){x*=2;if(x>9)x-=9}s+=x;d=!d}return s%10===0}
function fmtNum(n,net){
  n=(n||'').replace(/\D/g,'');
  if(net==='amex') return [n.slice(0,4),n.slice(4,10),n.slice(10,15)].filter(Boolean).join(' ');
  return n.replace(/(.{4})/g,'$1 ').trim();
}
function maskNum(n,net){
  n=(n||'').replace(/\D/g,'');
  if(!n) return '•••• •••• •••• ••••';
  const last=n.slice(-4);
  return net==='amex' ? '•••• •••••• ••'+n.slice(-3) : '•••• •••• •••• '+last;
}
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
function nextDay(day){
  day=+day; if(!day) return null;
  const t=new Date(); t.setHours(0,0,0,0);
  let d=new Date(t.getFullYear(),t.getMonth(),Math.min(day,daysIn(t.getFullYear(),t.getMonth())));
  if(d<t){const y=t.getFullYear(),m=t.getMonth()+1;d=new Date(y,m,Math.min(day,daysIn(y,m)))}
  return d;
}
const daysUntil=d=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)};
const fmtDate=d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
function expiryStatus(c){
  if(!c.expMonth||!c.expYear) return null;
  const end=new Date(+c.expYear,+c.expMonth,0); // last day of expiry month
  const days=daysUntil(end);
  if(days<0) return {cls:'bad',txt:'Expired'};
  if(days<=60) return {cls:'hot',txt:'Expires soon'};
  return null;
}
function ordinal(n){n=+n;const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}

/* ============ Crypto & storage ============ */
async function deriveKey(pass,salt,iter){
  const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptWith(key,salt,iter,data){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(data)));
  return {app:'cardvault',v:1,kdf:'PBKDF2-SHA256',iter,salt:b64(salt),iv:b64(iv),ct:b64(ct)};
}
async function decryptBlob(blob,pass){
  const salt=unb64(blob.salt), key=await deriveKey(pass,salt,blob.iter);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(blob.iv)},key,unb64(blob.ct));
  return {key,salt,iter:blob.iter,data:JSON.parse(dec.decode(pt))};
}

let K=null,SALT=null,KITER=ITER,V=null;
let settings={autolock:3};
try{Object.assign(settings,JSON.parse(localStorage.getItem(SETTINGS)||'{}'))}catch(e){}
const saveSettings=()=>localStorage.setItem(SETTINGS,JSON.stringify(settings));

async function persist(){
  const blob=await encryptWith(K,SALT,KITER,V);
  localStorage.setItem(STORE,JSON.stringify(blob));
}
async function createVault(pass,data){
  SALT=crypto.getRandomValues(new Uint8Array(16)); KITER=ITER;
  K=await deriveKey(pass,SALT,KITER);
  V=data||{cards:[],meta:{created:Date.now()}};
  V.meta=V.meta||{};
  await persist();
}
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* ============ Auto-lock ============ */
let lockTimer=null, hiddenAt=0, picking=false, fails=0, waitUntil=0;
function bump(){if(!K)return;clearTimeout(lockTimer);lockTimer=setTimeout(lock,settings.autolock*60000)}
['pointerdown','keydown','scroll','touchstart'].forEach(e=>addEventListener(e,bump,{passive:true}));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();document.body.classList.add('blur')}
  else{document.body.classList.remove('blur');if(K&&!picking&&Date.now()-hiddenAt>30000)lock()}
});
function lock(){
  K=null;V=null;SALT=null;clearTimeout(lockTimer);
  if(sheetOpen)closeSheet();
  renderLock();
}

/* ============ Sheet (bottom panel) ============ */
let sheetOpen=false;
function openSheet(html){
  sheetEl.innerHTML='<div class="grab"></div>'+html;
  sheetEl.scrollTop=0;
  overlay.classList.add('open');
  if(!sheetOpen){history.pushState({sheet:1},'');sheetOpen=true}
}
function closeSheet(fromPop){
  if(!sheetOpen)return;
  sheetOpen=false;overlay.classList.remove('open');sheetEl.innerHTML='';
  if(!fromPop)history.back();
}
addEventListener('popstate',()=>{if(sheetOpen)closeSheet(true)});
overlay.addEventListener('click',e=>{if(e.target===overlay)closeSheet()});

/* ============ File picking ============ */
function pickFile(){
  return new Promise(res=>{
    const fp=$('#filePick');fp.value='';picking=true;
    fp.onchange=async()=>{picking=false;const f=fp.files[0];if(!f)return res(null);try{res(JSON.parse(await f.text()))}catch(e){toast('That file is not valid JSON');res(null)}};
    addEventListener('focus',()=>setTimeout(()=>{picking=false},1500),{once:true});
    fp.click();
  });
}
async function downloadJSON(obj,name){
  const blob=new Blob([JSON.stringify(obj)],{type:'application/json'});
  const file=new File([blob],name,{type:'application/json'});
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
  if(ios&&navigator.canShare&&navigator.canShare({files:[file]})){
    picking=true;try{await navigator.share({files:[file],title:name})}catch(e){}picking=false;return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ============ Lock screen ============ */
function renderLock(restoreBlob){
  const exists=!!localStorage.getItem(STORE);
  const mode=restoreBlob?'restore':exists?'unlock':'create';
  const text={
    unlock:'Enter your master password',
    create:'Create a master password. It encrypts everything stored on this phone. If you forget it, the data cannot be recovered — so keep a backup.',
    restore:'Enter the master password that was used when this backup was made.'
  }[mode];
  app.innerHTML=`<div class="lock">
    <div class="logo">${ICON.logo}</div>
    <h1>Card Vault</h1>
    <p class="muted">${text}</p>
    <form id="lockForm" autocomplete="off">
      <input type="password" id="pw" placeholder="Master password" autocomplete="${mode==='create'?'new-password':'current-password'}" required>
      ${mode==='create'?'<input type="password" id="pw2" placeholder="Confirm master password" autocomplete="new-password" required>':''}
      <button class="btn primary" id="go" type="submit">${{unlock:'Unlock',create:'Create vault',restore:'Restore backup'}[mode]}</button>
      <p class="err" id="err"></p>
    </form>
    ${mode==='create'?'<button class="link" id="restoreBtn">Restore from a backup file</button>':''}
    ${mode==='restore'?'<button class="link" id="cancelRestore">Cancel</button>':''}
  </div>`;
  const err=$('#err'),go=$('#go');
  setTimeout(()=>$('#pw').focus(),50);
  $('#lockForm').onsubmit=async e=>{
    e.preventDefault();err.textContent='';
    const pw=$('#pw').value;
    if(Date.now()<waitUntil){err.textContent=`Too many attempts. Wait ${Math.ceil((waitUntil-Date.now())/1000)}s.`;return}
    go.disabled=true;go.textContent='Working…';
    try{
      if(mode==='create'){
        if(pw.length<6)throw new Error('Use at least 6 characters.');
        if(pw!==$('#pw2').value)throw new Error('Passwords do not match.');
        await createVault(pw);
      }else{
        const blob=restoreBlob||JSON.parse(localStorage.getItem(STORE));
        let r;try{r=await decryptBlob(blob,pw)}catch(x){
          fails++;if(fails>=5){waitUntil=Date.now()+30000;fails=0}
          throw new Error('Wrong password.');
        }
        fails=0;K=r.key;SALT=r.salt;KITER=r.iter;V=r.data;V.cards=V.cards||[];V.meta=V.meta||{};
        if(mode==='restore')await persist();
      }
      bump();renderMain();
      if(mode==='restore')toast(`Restored ${V.cards.length} card(s)`);
    }catch(x){err.textContent=x.message||'Something went wrong.';go.disabled=false;go.textContent={unlock:'Unlock',create:'Create vault',restore:'Restore backup'}[mode]}
  };
  const rb=$('#restoreBtn');
  if(rb)rb.onclick=async()=>{const blob=await pickFile();if(!blob)return;if(blob.app!=='cardvault'){toast('Not a Card Vault backup');return}renderLock(blob)};
  const cr=$('#cancelRestore');if(cr)cr.onclick=()=>renderLock();
}

  const expiring=cards.filter(c=>expiryStatus(c));

async function exportBackup(){
  V.meta.lastBackup=Date.now();await persist();
  const blob=JSON.parse(localStorage.getItem(STORE));
  const d=new Date().toISOString().slice(0,10);
  await downloadJSON(blob,`cardvault-backup-${d}.json`);
  renderTop();if(sheetOpen)openSettings();
  toast('Backup saved — keep it somewhere safe');
}
function mergeCards(incoming){
  let added=0,updated=0;
  for(const c of incoming){
    if(!c)continue;c.id=c.id||uid();
    const i=V.cards.findIndex(x=>x.id===c.id||(x.number&&c.number&&x.number===c.number));
    if(i<0){V.cards.push(c);added++}
    else if((c.updated||0)>(V.cards[i].updated||0)){V.cards[i]={...V.cards[i],...c,id:V.cards[i].id};updated++}
  }
  return {added,updated};
}
async function importBackup(){
  const blob=await pickFile();if(!blob)return;
  if(blob.app!=='cardvault'){toast('Not a Card Vault backup');return}
  const pw=prompt('Master password used for that backup:');if(pw===null)return;
  try{
    const r=await decryptBlob(blob,pw);
    const {added,updated}=mergeCards(r.data.cards||[]);
    await persist();renderTop();renderList();closeSheet();toast(`Imported: ${added} new, ${updated} updated`);
  }catch(e){toast('Wrong password for that backup')}
}
async function importBitwarden(){
  const j=await pickFile();if(!j)return;
  if(j.encrypted){toast('That export is encrypted. Export as plain .json from Bitwarden.');return}
  if(!Array.isArray(j.items)){toast('Not a Bitwarden JSON export');return}
  const brandMap={visa:'visa',mastercard:'mastercard',amex:'amex','american express':'amex',rupay:'rupay',discover:'discover',diners:'diners','diners club':'diners',maestro:'maestro',jcb:'jcb'};
  const now=Date.now();
  const cards=j.items.filter(i=>i.type===3&&i.card).map((i,n)=>{
    const k=i.card, number=(k.number||'').replace(/\D/g,'');
    const yr=k.expYear?String(k.expYear):'';
    return {id:uid(),type:'credit',network:brandMap[(k.brand||'').toLowerCase()]||detectNetwork(number),
      bank:'',nickname:i.name||'',number,holder:(k.cardholderName||'').toUpperCase(),
      expMonth:k.expMonth?String(k.expMonth).padStart(2,'0'):'',expYear:yr.length===2?'20'+yr:yr,cvv:k.code||'',
      notes:i.notes||'',color:COLORS[(V.cards.length+n)%COLORS.length],created:now,updated:now};
  });
  if(!cards.length){toast('No cards found in that file');return}
  const {added,updated}=mergeCards(cards);
  await persist();renderTop();renderList();closeSheet();
  toast(`Imported ${added} card(s)${updated?`, ${updated} updated`:''}. Now delete the Bitwarden export file.`);
}
function openChangePw(){
  openSheet(`
    <div class="sheet-h"><h2>Change master password</h2><button class="icon-btn" id="closeBtn" aria-label="Close">${ICON.x}</button></div>
    <form id="cpf">
      <label>Current password</label><input type="password" id="cp0" autocomplete="current-password" required>
      <label>New password</label><input type="password" id="cp1" autocomplete="new-password" required>
      <label>Confirm new password</label><input type="password" id="cp2" autocomplete="new-password" required>
      <p class="err" id="cperr"></p>
      <div class="btns"><button type="submit" class="btn primary" id="cpgo">Change password</button></div>
      <p class="muted" style="font-size:12px">Old backups will still need the old password.</p>
    </form>`);
  $('#closeBtn').onclick=()=>openSettings();
  $('#cpf').onsubmit=async e=>{
    e.preventDefault();const err=$('#cperr');err.textContent='';
    const p0=$('#cp0').value,p1=$('#cp1').value;
    if(p1.length<6){err.textContent='Use at least 6 characters.';return}
    if(p1!==$('#cp2').value){err.textContent='New passwords do not match.';return}
    $('#cpgo').disabled=true;
    try{await decryptBlob(JSON.parse(localStorage.getItem(STORE)),p0)}catch(x){err.textContent='Current password is wrong.';$('#cpgo').disabled=false;return}
    await createVault(p1,V);closeSheet();toast('Master password changed');
  };
}
