<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0e1116">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cards">
<meta name="referrer" content="no-referrer">
<!-- No network access at all: connect-src 'none' means this page cannot send your data anywhere. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'none'">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Card Vault</title>
<style>
:root{--bg:#0e1116;--panel:#161a22;--panel2:#1d222c;--line:#2a303c;--text:#e8ebf1;--muted:#8b93a3;--accent:#7c5cff;--accent2:#22c3a6;--danger:#ff5d6c;--warn:#ffb648;--ok:#3ddc97;
  --st:max(env(safe-area-inset-top),var(--safe-area-inset-top,0px));--sb:max(env(safe-area-inset-bottom),var(--safe-area-inset-bottom,0px));
  --ease:cubic-bezier(.2,.9,.3,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body{touch-action:manipulation}
body.blur #app,body.blur #overlay{filter:blur(22px)}
button,.tile,.chip-f,label{-webkit-user-select:none;user-select:none}
#app{max-width:560px;margin:0 auto;min-height:100dvh;padding:calc(var(--st) + 14px) 16px calc(110px + var(--sb))}
#app.fade{animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--muted)}
.small{font-size:12px}
.btn{border:0;border-radius:12px;padding:13px 16px;background:var(--panel2);cursor:pointer;font-weight:600;width:100%;transition:transform .12s,opacity .12s,background .15s}
.btn:active,.icon-btn:active,.chip-f:active,.paybtn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#5b8cff);color:#fff}
.btn.danger{background:rgba(255,93,108,.12);color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff}
.btn:disabled{opacity:.55}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:10px;font-weight:600}
.icon-btn{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .12s}
.icon-btn svg{width:20px;height:20px}
.err{color:var(--danger);min-height:20px;margin:8px 0 0;font-size:14px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* Lock */
.lock{min-height:80dvh;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:6px}
.lock .logo{width:80px;height:80px;margin:0 auto 12px}
.lock h1{margin:0;font-size:26px}
.lock form{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.finger{width:96px;height:96px;border-radius:50%;margin:26px auto 6px;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,rgba(124,92,255,.35),rgba(34,195,166,.15));border:1px solid rgba(124,92,255,.5);cursor:pointer;transition:transform .15s}
.finger:active{transform:scale(.93)}
.finger svg{width:50px;height:50px;color:#cfc4ff}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;margin:2px 0 16px;gap:10px}
header h1{margin:0;font-size:26px;letter-spacing:-.01em}
header .sub{font-size:13px;color:var(--muted)}
header .actions{display:flex;gap:8px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:19px;font-weight:700;margin-top:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.box h3{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
.box h3 button{background:none;border:0;color:var(--accent);font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;cursor:pointer;padding:2px 0}
.due{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.box h3+.due{border-top:0}
.due .when{font-size:12px;color:var(--muted)}
.due .when.hot{color:var(--warn)}
.paybtn{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .12s}
.paybtn.done{background:rgba(61,220,151,.12);border-color:rgba(61,220,151,.35);color:var(--ok)}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.pill.hot{background:rgba(255,182,72,.18);color:var(--warn)}
.pill.bad{background:rgba(255,93,108,.18);color:var(--danger)}
.tools{display:flex;flex-direction:column;gap:10px;margin:4px 0 14px}
.chips{display:flex;gap:8px}
.chip-f{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 15px;cursor:pointer;font-size:14px;transition:background .15s,color .15s,transform .12s}
.chip-f.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.list{display:flex;flex-direction:column;gap:14px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}

/* Runway */
.runway{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:1px solid rgba(124,92,255,.45);background:linear-gradient(135deg,rgba(124,92,255,.22),rgba(34,195,166,.12));border-radius:16px;padding:12px 14px;margin-bottom:12px;cursor:pointer;color:var(--text);transition:transform .12s}
.runway:active{transform:scale(.98)}
.runway .k{font-size:12px;color:#c9c0ff;font-weight:600;letter-spacing:.04em}
.runway .v{font-size:22px;font-weight:800;letter-spacing:-.01em}
.runway .r{text-align:right;min-width:0}
.runway .r div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw-quick{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.rw-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.rw-row:first-child{border-top:0}
.rw-row.best{background:linear-gradient(135deg,rgba(124,92,255,.2),rgba(34,195,166,.1))}
.rw-rank{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--panel);border:1px solid var(--line);flex:none}
.rw-row.best .rw-rank{background:var(--accent);border-color:var(--accent);color:#fff}
.rw-mid{flex:1;min-width:0}
.rw-mid .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw-mid .s{font-size:12px;color:var(--muted)}
.rw-days{text-align:right;flex:none}
.rw-days b{font-size:20px;display:block;line-height:1.1}
.rw-days span{font-size:11px;color:var(--muted)}
.rw-warn{color:var(--warn)!important}
/* Arrange */
.arow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel2);transition:background .15s,box-shadow .15s}
.arow:first-child{border-top:0}
.arow.dragging{background:#262c38;box-shadow:0 8px 24px rgba(0,0,0,.45);position:relative;z-index:2}
.arow .sw{width:34px;height:22px;border-radius:5px;flex:none}
.arow .grow{flex:1;min-width:0}
.arow .grow div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .mv{background:var(--panel);border:1px solid var(--line);border-radius:9px;width:34px;height:34px;cursor:pointer;color:var(--text);flex:none;font-size:14px}
.arow .handle{width:36px;height:40px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;flex:none}
.arow .handle svg{width:20px;height:20px}
.tools-row{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* Card visual */
.tile{box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;width:100%;aspect-ratio:1.586;border-radius:20px;padding:18px 20px;color:#fff;position:relative;overflow:hidden;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.4);transition:transform .15s var(--ease);outline:none}
.list .tile{animation:tileIn .35s var(--ease) both}
.list .tile:nth-child(2){animation-delay:.03s}.list .tile:nth-child(3){animation-delay:.06s}.list .tile:nth-child(4){animation-delay:.09s}.list .tile:nth-child(n+5){animation-delay:.12s}
@keyframes tileIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.tile:active{transform:scale(.985)}
.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.2),transparent 55%);pointer-events:none}
.tile .row{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
.tile .tr{display:flex;gap:6px;align-items:center}
.tile .bank{font-weight:700;font-size:17px;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .type{font-size:10px;text-transform:uppercase;letter-spacing:.12em;opacity:.9;border:1px solid rgba(255,255,255,.4);padding:2px 8px;border-radius:99px}
.tile .pill{background:rgba(0,0,0,.4)}
.tile .emv{width:42px;height:32px;border-radius:7px;background:linear-gradient(135deg,#f5d77a,#c9a443)}
.tile .eye{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.22);display:grid;place-items:center;cursor:pointer;color:#fff;transition:transform .12s,background .15s}
.tile .eye:active{transform:scale(.9)}
.tile .eye svg{width:19px;height:19px}
.tile .num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:clamp(16px,5.4vw,22px);letter-spacing:.08em;position:relative;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.3);display:flex;align-items:center;gap:10px}
.tile .num.live{cursor:copy;font-size:clamp(14px,4.5vw,19px);white-space:nowrap;letter-spacing:.06em}
.tile .cp{font-family:system-ui,sans-serif;font-size:10px;letter-spacing:.1em;font-weight:700;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.22)}
.tile .nick{font-size:13px;opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .meta{font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.04em}
.tile .net{font-weight:800;font-style:italic;font-size:16px;letter-spacing:.02em;flex:none}
.c-midnight{background:linear-gradient(135deg,#24345e,#0b1020)}
.c-ocean{background:linear-gradient(135deg,#0f4c81,#1aa0c8)}
.c-emerald{background:linear-gradient(135deg,#0b6b4f,#1fbf8a)}
.c-crimson{background:linear-gradient(135deg,#7a0f1f,#d6304a)}
.c-gold{background:linear-gradient(135deg,#6e500e,#d9a93a)}
.c-violet{background:linear-gradient(135deg,#3b1e7a,#8a5cff)}
.c-rose{background:linear-gradient(135deg,#7a1e4f,#e0609a)}
.c-metal{background:linear-gradient(135deg,#111,#4a4a4a)}
.c-slate{background:linear-gradient(135deg,#2f3a4a,#61708a)}
.c-sunset{background:linear-gradient(135deg,#a63b14,#f39c3d)}

.fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(22px + var(--sb));width:60px;height:60px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--accent),#5b8cff);color:#fff;box-shadow:0 10px 30px rgba(124,92,255,.45);cursor:pointer;display:grid;place-items:center;transition:transform .15s var(--ease);z-index:5}
.fab:active{transform:scale(.9)}
.fab svg{width:28px;height:28px}

/* Bottom sheet */
#overlay{position:fixed;inset:0;z-index:20;visibility:hidden;pointer-events:none}
#overlay.open{visibility:visible;pointer-events:auto}
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .25s}
#overlay.open #scrim{opacity:1}
#overlay.closing #scrim{opacity:0}
#sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:calc(100dvh - var(--st) - 12px);overflow-y:auto;overscroll-behavior:contain;background:var(--panel);border-radius:24px 24px 0 0;padding:8px 18px calc(28px + var(--sb));transform:translateY(100%);transition:transform .3s var(--ease);will-change:transform}
#overlay.open #sheet{transform:none}
#overlay.closing #sheet{transform:translateY(100%);transition:transform .22s ease-in}
#sheet .pane.fwd{animation:inR .24s var(--ease)}
#sheet .pane.back{animation:inL .24s var(--ease)}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-h h2{margin:0;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-h .l{display:flex;align-items:center;gap:8px;min-width:0}
.fields{background:var(--panel2);border-radius:14px;margin-top:14px;overflow:hidden}
.field{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field .l{font-size:12px;color:var(--muted)}
.field .v{word-break:break-word}
.field .v.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.04em}
.field .grow{flex:1;min-width:0}
.copy{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--text);transition:transform .12s}
.copy:active{transform:scale(.92)}
.section-t{margin:20px 0 0;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;margin:14px 0 0;font-size:15px;color:var(--text);text-transform:none;letter-spacing:0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.colors{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.colors input{display:none}
.colors label{margin:0;width:38px;height:38px;border-radius:12px;cursor:pointer;border:2px solid transparent;transition:transform .12s}
.colors input:checked+label{border-color:#fff;box-shadow:0 0 0 2px var(--accent);transform:scale(1.08)}
.btns{display:flex;gap:10px;margin-top:20px}
.set-item{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-top:1px solid var(--line);gap:12px}
.set-item:first-child{border-top:0}
.set-item select{width:auto;padding:8px 10px}
.set-item .btn{width:auto;padding:9px 14px;flex:none;background:var(--panel);border:1px solid var(--line)}
.set-item .btn.danger{background:rgba(255,93,108,.12);border-color:rgba(255,93,108,.3)}
.switch{position:relative;width:50px;height:30px;border-radius:99px;background:var(--line);border:0;cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px)}

/* Dialog */
#dialog{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.6)}
#dialog.open{display:flex;animation:fadeIn .15s}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;width:100%;max-width:380px;animation:pop .2s var(--ease)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.dlg h3{margin:0 0 8px;font-size:18px}
.dlg p{margin:0 0 12px;line-height:1.5}

#toast{position:fixed;left:50%;bottom:calc(100px + var(--sb));transform:translateX(-50%) translateY(16px);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.22s var(--ease);z-index:60;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"><div id="scrim"></div><div id="sheet"></div></div>
<div id="dialog"></div>
<div id="toast"></div>
<input type="file" id="filePick" accept="application/json,.json" hidden>

<script>
'use strict';
/* ============ Utilities ============ */
const $ = s => document.querySelector(s);
const app = $('#app'), overlay = $('#overlay'), sheetEl = $('#sheet');
const enc = new TextEncoder(), dec = new TextDecoder();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const uid = () => b64(crypto.getRandomValues(new Uint8Array(9))).replace(/[+/=]/g,'x');
const inr = n => '₹' + Number(n||0).toLocaleString('en-IN');
const STORE = 'cardvault.v1', SETTINGS = 'cardvault.settings';
const ITER = 310000;
const APP_VERSION = '2.2';

/* Native (APK) bridge — present only when running as the installed Android app */
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const nat=(plugin,method,opts={})=>window.Capacitor.nativePromise(plugin,method,opts);
const BIO_SERVER='cardvault-master';

const ICON = {
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68 1.65 1.65 0 0 0 10 3.17V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',

/* Vibration: kind = tap | success | error | warn | tick ; level from Settings (off/subtle/light/medium) */
function haptic(kind='tap',levelOverride){
  const level=levelOverride||settings.haptics||'light';
  if(level==='off')return;
  if(!NATIVE){const ms={subtle:4,light:8,medium:18}[level]||8;if(navigator.vibrate)try{navigator.vibrate(kind==='error'?[ms,40,ms]:ms)}catch(e){}return}
  if(level==='medium'){
    const p=kind==='success'?nat('Haptics','notification',{type:'SUCCESS'}):kind==='error'?nat('Haptics','notification',{type:'ERROR'}):nat('Haptics','impact',{style:'MEDIUM'});
    return p.catch(()=>{});
  }
  // subtle / light use Android's own system haptics (crisp, low-strength ticks)
  const sys=level==='subtle'?'tick':kind==='success'?'confirm':kind==='error'?'reject':kind==='tick'?'tick':'tap';
  nat('Tick','tick',{kind:sys}).catch(()=>nat('Haptics','impact',{style:'LIGHT'}).catch(()=>{}));
}

/* ============ Card helpers ============ */
function detectNetwork(n){
  n=(n||'').replace(/\D/g,'');
  if(!n) return '';
  if(/^3[47]/.test(n)) return 'amex';
  if(/^(508|60|65|81|82|353|356)/.test(n)) return 'rupay';
  if(/^4/.test(n)) return 'visa';
  if(/^(5[1-5]|222[1-9]|22[3-9]|2[3-6]|27[01]|2720)/.test(n)) return 'mastercard';
  if(/^3(0[0-5]|[689])/.test(n)) return 'diners';
  if(/^35/.test(n)) return 'jcb';
  if(/^(50|5[6-9]|6)/.test(n)) return 'maestro';
  return 'other';
}
function luhn(n){n=(n||'').replace(/\D/g,'');if(n.length<12)return false;let s=0,d=false;for(let i=n.length-1;i>=0;i--){let x=+n[i];if(d){x*=2;if(x>9)x-=9}s+=x;d=!d}return s%10===0}
function fmtNum(n,net){
  n=(n||'').replace(/\D/g,'');
  if(net==='amex') return [n.slice(0,4),n.slice(4,10),n.slice(10,15)].filter(Boolean).join(' ');
  return n.replace(/(.{4})/g,'$1 ').trim();
}
function maskNum(n,net){
  n=(n||'').replace(/\D/g,'');
  if(!n) return '•••• •••• •••• ••••';
  return net==='amex' ? '•••• •••••• •'+n.slice(-4) : '•••• •••• •••• '+n.slice(-4);
}
const netOf=c=>c.network||detectNetwork(c.number);
const nameOf=c=>c.nickname||c.bank||'Card';
const last4=c=>(c.number||'').slice(-4);
const expOf=c=>c.expMonth&&c.expYear?`${c.expMonth}/${String(c.expYear).slice(-2)}`:'';
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
const today=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
function nextDay(day){
  day=+day; if(!day) return null;
  const t=today();
  let d=new Date(t.getFullYear(),t.getMonth(),Math.min(day,daysIn(t.getFullYear(),t.getMonth())));
  if(d<t){const y=t.getFullYear(),m=t.getMonth()+1;d=new Date(y,m,Math.min(day,daysIn(y,m)))}
  return d;
}
function occurrence(day,k){const f=nextDay(day);if(!f)return null;const y=f.getFullYear(),m=f.getMonth()+k;return new Date(y,m,Math.min(+day,daysIn(y,m)))}
const daysUntil=d=>Math.round((d-today())/864e5);
const fmtDate=d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const isoDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const rel=n=>n===0?'today':n===1?'tomorrow':`in ${n} days`;
function expiryStatus(c){
  if(!c.expMonth||!c.expYear) return null;
  const days=daysUntil(new Date(+c.expYear,+c.expMonth,0));
  if(days<0) return {cls:'bad',txt:'Expired'};
  if(days<=60) return {cls:'hot',txt:'Expires soon'};
  return null;
}
function ordinal(n){n=+n;const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
/* Runway: buy on date P -> lands on the next statement (statement day itself counts as that bill, the cautious choice) -> pay by the due date after it */
const atDay=(y,m,day)=>new Date(y,m,Math.min(+day,daysIn(y,m)));
function runwayFor(c,P){
  if(c.type!=='credit'||!c.statementDay||!c.dueDay)return null;
  let stmt=atDay(P.getFullYear(),P.getMonth(),c.statementDay);
  if(stmt<P)stmt=atDay(P.getFullYear(),P.getMonth()+1,c.statementDay);
  let due=atDay(stmt.getFullYear(),stmt.getMonth(),c.dueDay);
  if(due<=stmt)due=atDay(stmt.getFullYear(),stmt.getMonth()+1,c.dueDay);
  return {c,stmt,due,days:Math.round((due-P)/864e5),edge:stmt.getTime()===P.getTime()};
}
function runwayRank(P){
  return V.cards.map(c=>runwayFor(c,P)).filter(Boolean).sort((a,b)=>b.days-a.days||nameOf(a.c).localeCompare(nameOf(b.c)));
}
const isPaid=(c,d)=>!!(V.meta.paid&&V.meta.paid[c.id]===isoDay(d));

/* Shared credit limits: cards with the same limitGroup share one limit */
const groupOthers=c=>c.limitGroup?V.cards.filter(x=>x.limitGroup===c.limitGroup&&x.id!==c.id):[];
function cleanupGroups(){
  const count={};V.cards.forEach(c=>{if(c.limitGroup)count[c.limitGroup]=(count[c.limitGroup]||0)+1});
  V.cards.forEach(c=>{if(c.limitGroup&&count[c.limitGroup]<2)delete c.limitGroup});
}
function totalLimit(){
  const seen=new Set();let t=0;
  for(const c of V.cards){if(c.type!=='credit'||!+c.limit)continue;if(c.limitGroup){if(seen.has(c.limitGroup))continue;seen.add(c.limitGroup)}t+=+c.limit}
  return t;
}

/* ============ Crypto & storage ============ */
async function deriveKey(pass,salt,iter){
  const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptWith(key,salt,iter,data){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(data)));
  return {app:'cardvault',v:1,kdf:'PBKDF2-SHA256',iter,salt:b64(salt),iv:b64(iv),ct:b64(ct)};
}
async function decryptBlob(blob,pass){
  const salt=unb64(blob.salt), key=await deriveKey(pass,salt,blob.iter);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(blob.iv)},key,unb64(blob.ct));
  return {key,salt,iter:blob.iter,data:JSON.parse(dec.decode(pt))};
}

async function persist(){localStorage.setItem(STORE,JSON.stringify(await encryptWith(K,SALT,KITER,V)))}
async function createVault(pass,data){
  SALT=crypto.getRandomValues(new Uint8Array(16));KITER=ITER;
  K=await deriveKey(pass,SALT,KITER);
  V=data||{cards:[],meta:{created:Date.now()}};V.meta=V.meta||{};
  await persist();
}

async function bioAvailable(){

async function enableBio(pw){

    settings.bio=true;saveSettings();haptic('success');toast('Fingerprint unlock is on');return true;
  }catch(e){toast('Fingerprint not turned on'+(e&&e.message?' — '+e.message:''));return false}

let bioBusy=false;
async function bioUnlock(){
  if(bioBusy||K||!NATIVE||!settings.bio)return;
  bioBusy=true;picking=true;
  try{
    const cred=await nat('NativeBiometric','getSecureCredentials',{server:BIO_SERVER,title:'Unlock Card Vault',subtitle:'Touch the fingerprint sensor',negativeButtonText:'Use password'});
    let r;
    try{r=await decryptBlob(JSON.parse(localStorage.getItem(STORE)),cred.password)}
    catch(x){await disableBio();renderLock(null,false);$('#err').textContent='Fingerprint key is out of date. Unlock with your password, then turn fingerprint on again in Settings.';return}
    haptic('tap');onUnlocked(r);
  }catch(e){
    const msg=(e&&e.message)||'';
    if((e&&e.code==='21')||/No protected/i.test(msg)){await disableBio();renderLock(null,false);$('#err').textContent='Fingerprint unlock was reset. Use your password.'}
    else if(String(e&&e.code)==='16'||/cancel/i.test(msg)){showPwForm()}
    else if(['2','4'].includes(String(e&&e.code))){showPwForm();$('#err').textContent='Too many fingerprint attempts. Use your master password.'}
    else if(msg&&$('#err'))$('#err').textContent=msg;
  }finally{bioBusy=false;setTimeout(()=>{picking=false},800)}
}
function onUnlocked(r,isNew){

    <div class="btns"><button class="btn" id="bioNo">Not now</button><button class="btn primary" id="bioYes">Turn on</button></div>`,
    bind:()=>{$('#bioNo').onclick=popSheet;$('#bioYes').onclick=async()=>{await enableBio(pw);popSheet()}}});

}

/* ============ Payment reminders (APK only) ============ */
function hashId(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return Math.abs(h)%2000000000+1}
async function scheduleReminders(){
  if(!NATIVE||!V)return;
  try{
    const pend=await nat('LocalNotifications','getPending');
    if(pend&&pend.notifications&&pend.notifications.length)await nat('LocalNotifications','cancel',{notifications:pend.notifications.map(n=>({id:n.id}))});
    const R=settings.remind;if(!R.on&&!R.statement)return;
    await nat('LocalNotifications','createChannel',{id:'dues',name:'Payment reminders',description:'Credit card payment due dates',importance:4,visibility:0,vibration:true}).catch(()=>{});
    const list=[],now=Date.now();
    for(const c of V.cards){
      if(c.type!=='credit')continue;
      const label=`${nameOf(c)}${last4(c)?' ··'+last4(c):''}`;
      if(R.statement&&c.statementDay)for(let k=0;k<6;k++){
        const sd=occurrence(c.statementDay,k),at=new Date(sd);at.setHours(+R.hour,0,0,0);
        if(at.getTime()>now+60000)list.push({id:hashId(c.id+isoDay(sd)+'/stmt'),title:'Statement day',body:`${label} — today's statement is being generated. Check your bill amount.`,channelId:'dues',schedule:{at:at.toISOString(),allowWhileIdle:true},smallIcon:'ic_stat_card',iconColor:'#7C5CFF'});
      }
      if(!R.on||!c.dueDay)continue;
      for(let k=0;k<6;k++){
        const due=occurrence(c.dueDay,k);
        if(isPaid(c,due))continue;
        const add=(before,title,body)=>{
          const at=new Date(due);at.setDate(at.getDate()-before);at.setHours(+R.hour,0,0,0);
          if(at.getTime()>now+60000)list.push({id:hashId(c.id+isoDay(due)+'/'+before),title,body,channelId:'dues',schedule:{at:at.toISOString(),allowWhileIdle:true},smallIcon:'ic_stat_card',iconColor:'#7C5CFF'});
        };
        if(+R.daysBefore>0)add(+R.daysBefore,`Card payment due in ${R.daysBefore} day${+R.daysBefore>1?'s':''}`,`${label} — due ${fmtDate(due)}. Open Card Vault and tap "Mark paid" once done.`);
        if(R.onDay)add(0,'Card payment due today',`${label} — pay today to avoid late fees.`);
      }
    }
    if(list.length)await nat('LocalNotifications','schedule',{notifications:list});
  }catch(e){console.warn('reminders',e)}
}
async function notifPermission(){
  if(!NATIVE){toast('Reminders work in the Android app');return false}
  try{const p=await nat('LocalNotifications','requestPermissions');if(p.display!=='granted'){toast('Allow notifications for Card Vault in phone Settings → Apps');return false}return true}
  catch(e){toast('Could not get notification permission');return false}
}
async function setReminders(on,key='on'){
  if(on&&!(await notifPermission()))return false;
  settings.remind[key]=on;settings.remindAsked=true;saveSettings();
  await scheduleReminders();
  if(on){haptic('success');toast(key==='statement'?'Statement-day alerts are on':'Payment reminders are on')}
  return true;
}
async function togglePaid(id){
  const c=V.cards.find(x=>x.id===id);if(!c||!c.dueDay)return;
  const d=nextDay(c.dueDay);V.meta.paid=V.meta.paid||{};
  if(isPaid(c,d)){delete V.meta.paid[c.id];haptic('tap')}else{V.meta.paid[c.id]=isoDay(d);haptic('success');toast(`${nameOf(c)} marked as paid`)}
  await persist();renderSummary();scheduleReminders();
}

function pickFile(){
  return new Promise(res=>{
    const fp=$('#filePick');fp.value='';picking=true;
    fp.onchange=async()=>{const f=fp.files[0];setTimeout(()=>{picking=false},800);if(!f)return res(null);try{res(JSON.parse(await f.text()))}catch(e){toast('That file is not a valid backup');res(null)}};
    addEventListener('focus',()=>setTimeout(()=>{picking=false},1500),{once:true});
    fp.click();
  });
}
async function saveFile(obj,name){
  const json=JSON.stringify(obj);
  if(NATIVE){
    picking=true;
    try{
      const r=await nat('Filesystem','writeFile',{path:name,data:json,directory:'CACHE',encoding:'utf8'});
      await nat('Share','share',{title:name,dialogTitle:'Save backup to…',files:[r.uri]});
      return true;
    }catch(e){if(!/cancel/i.test((e&&e.message)||''))toast('Could not save backup: '+((e&&e.message)||e));return false}
    finally{setTimeout(()=>{picking=false},800)}
  }
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  return true;
}

/* ============ Lock screen ============ */
function renderLock(restoreBlob,autoBio=true){
  const exists=!!localStorage.getItem(STORE);
  const mode=restoreBlob?'restore':exists?'unlock':'create';
  const useBio=mode==='unlock'&&NATIVE&&settings.bio;
  const text={unlock:useBio?'Locked':'Enter your master password',
    create:'Create a master password. It encrypts everything stored on this phone. If you forget it, the data cannot be recovered, so keep a backup.',
    restore:'Enter the master password that was used when this backup was made.'}[mode];
  const btnText={unlock:'Unlock',create:'Create vault',restore:'Restore backup'}[mode];
  app.className='fade';
  app.innerHTML=`<div class="lock">
    <div class="logo">${ICON.logo}</div>
    <h1>Card Vault</h1>
    <p class="muted" style="margin:4px 0 0">${text}</p>
    ${useBio?`<button class="finger" id="bioBtn" aria-label="Unlock with fingerprint">${ICON.finger}</button><div class="muted small">Tap to unlock with fingerprint</div>`:''}
    <form id="lockForm" autocomplete="off" ${useBio?'hidden':''}>
      <input type="password" id="pw" placeholder="Master password" autocomplete="${mode==='create'?'new-password':'current-password'}" enterkeyhint="go" required>
      ${mode==='create'?'<input type="password" id="pw2" placeholder="Confirm master password" autocomplete="new-password" enterkeyhint="go" required>':''}
      <button class="btn primary" id="go" type="submit">${btnText}</button>
    </form>
    <p class="err" id="err"></p>
    ${useBio?'<button class="link" id="usePw">Use master password</button>':''}
    ${mode==='create'?'<button class="link" id="restoreBtn">Restore from a backup file</button>':''}
    ${mode==='restore'?'<button class="link" id="cancelRestore">Cancel</button>':''}
  </div>`;
  const err=$('#err'),go=$('#go');
  if(useBio){$('#bioBtn').onclick=bioUnlock;$('#usePw').onclick=showPwForm;if(autoBio&&!document.hidden)setTimeout(bioUnlock,300)}
  else if(mode!=='create'||!restoreBlob)setTimeout(()=>{const p=$('#pw');if(p&&mode!=='create')p.focus()},80);
  $('#lockForm').onsubmit=async e=>{
    e.preventDefault();err.textContent='';
    const pw=$('#pw').value;
    if(Date.now()<waitUntil){err.textContent=`Too many attempts. Wait ${Math.ceil((waitUntil-Date.now())/1000)}s.`;return}
    go.disabled=true;go.textContent='Unlocking…';
    try{
      if(mode==='create'){
        if(pw.length<6)throw new Error('Use at least 6 characters.');
        if(pw!==$('#pw2').value)throw new Error('Passwords do not match.');
        await createVault(pw);bump();renderMain(true);
      }else{
        const blob=restoreBlob||JSON.parse(localStorage.getItem(STORE));
        let r;try{r=await decryptBlob(blob,pw)}catch(x){fails++;if(fails>=5){waitUntil=Date.now()+30000;fails=0}throw new Error('Wrong password.')}
        fails=0;onUnlocked(r);
        if(mode==='restore'){await persist();toast(`Restored ${V.cards.length} card(s)`)}
      }
      haptic('tap');
      offerBio(pw);
    }catch(x){
      haptic('error');err.textContent=x.message||'Something went wrong.';
      const f=$('#lockForm');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');
      go.disabled=false;go.textContent=btnText;
    }
  };
  const rb=$('#restoreBtn');
  if(rb)rb.onclick=async()=>{const blob=await pickFile();if(!blob)return;if(blob.app!=='cardvault'){toast('Not a Card Vault backup');return}renderLock(blob)};
  const cr=$('#cancelRestore');if(cr)cr.onclick=()=>renderLock();
}

  const f=$('#lockForm');if(!f)return;
  f.hidden=false;const u=$('#usePw');if(u)u.hidden=true;

}

      const pos=numEl.selectionStart,before=numEl.value.length;
      numEl.value=fmtNum(raw,net);
      if(document.activeElement===numEl){const p=Math.max(0,pos+(numEl.value.length-before));numEl.setSelectionRange(p,p)}
      const bad=raw.length>=12&&!luhn(raw),det=NETWORKS[detectNetwork(raw)];
      warn.textContent=bad?'This number fails the checksum — double-check for a typo.':raw&&det?`Detected: ${det}`:'';
      warn.style.color=bad?'var(--warn)':'var(--muted)';
    };
    numEl.oninput=checkNum;netEl.onchange=checkNum;checkNum();
    $('#f_exp').oninput=e=>{let v=e.target.value.replace(/\D/g,'').slice(0,4);if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);e.target.value=v};

      e.preventDefault();
      const g=k=>$('#f_'+k).value.trim();
      const number=g('number').replace(/\D/g,'');
      let expMonth='',expYear='';
      if(g('exp')){
        const m=g('exp').match(/^(\d{1,2})\/?(\d{2})$/);
        if(!m||+m[1]<1||+m[1]>12){toast('Expiry should look like 08/29');haptic('error');$('#f_exp').focus();return}
        expMonth=m[1].padStart(2,'0');expYear='20'+m[2];
      }
      if(!g('bank')&&!g('nickname')&&!number){toast('Add at least a bank, nickname or number');haptic('error');return}
      const now=Date.now(),type=g('type'),ltf=$('#f_ltf').checked;
      const card={...c,
        id:c.id||uid(),type,network:netEl.value||detectNetwork(number),
        bank:g('bank'),nickname:g('nickname'),number,holder:g('holder').toUpperCase(),
        expMonth,expYear,cvv:g('cvv'),
        limit:g('limit'),statementDay:g('statementDay'),dueDay:g('dueDay'),
        ltf,annualFee:ltf?'':g('annualFee'),feeWaiver:ltf?'':g('feeWaiver'),
        rewards:g('rewards'),care:g('care'),notes:g('notes'),
        color:(sheetEl.querySelector('input[name=color]:checked')||{}).value||'midnight',
        created:c.created||now,updated:now};
      // shared limit
      delete card.limitGroup;
      const shareWith=type==='credit'?g('share'):'';
      if(shareWith){
        const o=V.cards.find(x=>x.id===shareWith);
        if(o){const grp=o.limitGroup||('g'+uid());o.limitGroup=grp;card.limitGroup=grp;if(!card.limit)card.limit=o.limit}
      }
      if(!id&&V.meta.customOrder)card.order=Math.max(-1,...V.cards.map(x=>x.order??-1))+1;
      if(id)V.cards=V.cards.map(x=>x.id===id?card:x);else V.cards.push(card);
      if(card.limitGroup)V.cards.forEach(x=>{if(x.limitGroup===card.limitGroup)x.limit=card.limit});
      cleanupGroups();
      await persist();haptic('success');refreshHome();scheduleReminders();
      if(isNew)replaceSheet(detailView(card.id));else popSheet();
      toast(isNew?'Card added':'Saved');
    };
  }};
}

        <div class="rw-days"><b>${r.days}</b><span>days</span></div></div>`).join('')}

  };
  return {html:()=>`
    <div class="sheet-h"><h2>${ICON.plane.replace('width="14" height="14"','width="20" height="20"')} Runway</h2><button class="icon-btn" id="closeBtn" aria-label="Close">${ICON.x}</button></div>

  bind:()=>{

}

/* ============ Arrange cards ============ */
function arrangeView(){
  const rowHTML=c=>`<div class="arow" data-id="${esc(c.id)}"><div class="sw c-${esc(c.color||'midnight')}"></div>
    <div class="grow"><div>${esc(nameOf(c))}</div><div class="muted small">${esc(c.bank||'')}${last4(c)?' ··'+esc(last4(c)):''}</div></div>
    <button class="mv" data-mv="up" aria-label="Move up">▲</button><button class="mv" data-mv="down" aria-label="Move down">▼</button>
    <div class="handle" aria-label="Drag to reorder">${ICON.grip}</div></div>`;
  const save=async()=>{
    [...$('#arrList').children].forEach((r,i)=>{const c=V.cards.find(x=>x.id===r.dataset.id);if(c)c.order=i});
    V.meta.customOrder=true;await persist();renderList(false);
  };
  return {html:()=>`
    <div class="sheet-h"><h2>Arrange cards</h2><button class="icon-btn" id="closeBtn" aria-label="Close">${ICON.x}</button></div>
    <p class="muted" style="margin:0 0 4px">Drag ⠿ or use the arrows. Your order is saved automatically.</p>
    <div class="fields" id="arrList">${[...V.cards].sort(cardSort).map(rowHTML).join('')}</div>
    <div class="btns"><button class="btn" id="arrReset">Reset to A–Z</button><button class="btn primary" id="arrDone">Done</button></div>`,
  bind:()=>{
    const list=$('#arrList');
    $('#closeBtn').onclick=popSheet;$('#arrDone').onclick=popSheet;
    $('#arrReset').onclick=async()=>{V.meta.customOrder=false;V.cards.forEach(c=>delete c.order);await persist();renderList(false);haptic('tap');toast('Sorted A–Z');refreshSheet()};
    list.onclick=e=>{
      const b=e.target.closest('[data-mv]');if(!b)return;
      const row=b.closest('.arow');
      if(b.dataset.mv==='up'&&row.previousElementSibling)list.insertBefore(row,row.previousElementSibling);
      else if(b.dataset.mv==='down'&&row.nextElementSibling)list.insertBefore(row.nextElementSibling,row);
      else return;
      haptic('tick');save();
    };
    list.addEventListener('pointerdown',e=>{
      const h=e.target.closest('.handle');if(!h)return;
      e.preventDefault();
      const row=h.closest('.arow');row.classList.add('dragging');haptic('tap');
      const pid=e.pointerId;
      const move=ev=>{
        if(ev.pointerId!==pid)return;ev.preventDefault();
        let before=null;
        for(const r of list.children){if(r===row)continue;const rc=r.getBoundingClientRect();if(ev.clientY<rc.top+rc.height/2){before=r;break}}
        if(before!==row.nextElementSibling&&before!==row){list.insertBefore(row,before);haptic('tick')}
      };
      const up=ev=>{if(ev.pointerId!==pid)return;row.classList.remove('dragging');removeEventListener('pointermove',move);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);save()};
      addEventListener('pointermove',move,{passive:false});addEventListener('pointerup',up);addEventListener('pointercancel',up);
    });
  }};
}

      <p class="err" id="cperr"></p>
      <div class="btns"><button type="submit" class="btn primary" id="cpgo">Change password</button></div>
      <p class="muted small">Old backups will still need the old password.</p>
    </form>`,
  bind:()=>{
    $('#backBtn').onclick=popSheet;
    $('#cpf').onsubmit=async e=>{
      e.preventDefault();const err=$('#cperr');err.textContent='';
      const p0=$('#cp0').value,p1=$('#cp1').value;
      if(p1.length<6){err.textContent='Use at least 6 characters.';return}
      if(p1!==$('#cp2').value){err.textContent='New passwords do not match.';return}
      $('#cpgo').disabled=true;
      try{await decryptBlob(JSON.parse(localStorage.getItem(STORE)),p0)}catch(x){haptic('error');err.textContent='Current password is wrong.';$('#cpgo').disabled=false;return}
      await createVault(p1,V);haptic('success');popSheet();toast('Master password changed');
      if(settings.bio&&!(await enableBio(p1))){await disableBio();toast('Password changed. Turn fingerprint on again in Settings.')}
    };
  }};
}
async function exportBackup(){
  V.meta.lastBackup=Date.now();await persist();
  const ok=await saveFile(JSON.parse(localStorage.getItem(STORE)),`cardvault-backup-${new Date().toISOString().slice(0,10)}.json`);
  renderSummary();refreshSheet();
  if(ok)toast('Backup saved — keep it somewhere safe');
}
function mergeCards(incoming){
  let added=0,updated=0;
  for(const c of incoming){
    if(!c)continue;c.id=c.id||uid();
    const i=V.cards.findIndex(x=>x.id===c.id||(x.number&&c.number&&x.number===c.number));
    if(i<0){V.cards.push(c);added++}
    else if((c.updated||0)>(V.cards[i].updated||0)){V.cards[i]={...V.cards[i],...c,id:V.cards[i].id};updated++}
  }
  cleanupGroups();
  return {added,updated};
}
async function importBackup(){
  const blob=await pickFile();if(!blob)return;
  if(blob.app!=='cardvault'){toast('Not a Card Vault backup');return}
  const pw=await dialog({title:'Backup password',message:'Enter the master password that was used when this backup was made.',input:'password',ok:'Import'});
  if(pw===null)return;
  try{
    const r=await decryptBlob(blob,pw);
    const {added,updated}=mergeCards(r.data.cards||[]);
    await persist();haptic('success');refreshHome();scheduleReminders();closeAllSheets();toast(`Imported: ${added} new, ${updated} updated`);
  }catch(e){haptic('error');toast('Wrong password for that backup')}
}

/* ============ Boot ============ */
if(!window.crypto||!crypto.subtle){
  app.innerHTML='<div class="lock"><h1>Card Vault</h1><p class="muted">This page must be opened over https (or installed from your hosted link) for encryption to work.</p></div>';
}else{
  renderLock();
}
if(!NATIVE&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
